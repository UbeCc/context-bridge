[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-bridge"
version = "0.1.0"
description = "Git-backed shared context and memory hub for multi-bot AI agent fleets, with a web console"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "UbeCc" }]
keywords = ["agents", "memory", "multi-agent", "dashboard", "git"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ctxbridge = "context_bridge.cli:main"

[tool.setuptools.packages.find]
include = ["context_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
