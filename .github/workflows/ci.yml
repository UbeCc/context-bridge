name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q

  public-safety:
    name: public-safety scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan tracked files for leaks
        run: python scripts/check_public_safety.py

  shell:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: |
          bash -n scripts/deploy.sh
          bash -n scripts/ctxbridge
      - name: ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --severity=error -x scripts/deploy.sh scripts/ctxbridge

  build:
    name: package build + demo smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --quiet build
          python -m build
          ls -la dist/
      - name: Install the built wheel
        run: python -m pip install --quiet dist/*.whl
      - name: CLI import smoke
        run: |
          ctxbridge --version
          python -c "import context_bridge, context_bridge.cli; print(context_bridge.__version__)"
      - name: Generate the synthetic demo hub
        run: |
          python -m pip install --quiet -e ".[dev]"
          python scripts/make-demo-hub.py --out /tmp/demo-hub --now 2026-11-13T12:00:00Z
          python -m context_bridge.cli \
            --config /tmp/demo-hub/demo.toml status --json > /tmp/demo-status.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/demo-status.json"))
          assert data["records"] > 0, data
          assert data["board_cards"] > 0, data
          assert len(data["bots"]) == 3, data
          print(f"demo hub OK: {data['records']} records, {data['board_cards']} cards")
          PY
