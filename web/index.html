<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>

        <span class="brand-mark" aria-hidden="true">

        </button>

        </button>

    <div class="scrim" id="nav-scrim" data-action="toggle-nav" hidden></div>

        </div>
        <div class="topbar-actions">
          <button class="btn btn-ghost topbar-sync" type="button" data-action="manual-sync" title="触发一次采集同步">

          <button class="icon-btn topbar-theme" type="button" data-action="toggle-theme" aria-label="切换明暗主题">
            <svg class="icon icon-sun"><use href="#i-sun"/></svg>
            <svg class="icon icon-moon"><use href="#i-moon"/></svg>
          </button>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1" aria-busy="true">
        <div class="view-loading">
          <div class="skeleton skeleton-title"></div>
          <div class="skeleton-grid">

            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
          </div>
          <div class="skeleton skeleton-panel"></div>
